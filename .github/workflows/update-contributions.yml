name: Update contribution activity

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/contributions.svg"
      - "assets/engineering-pulse.svg"

permissions:
  contents: write

concurrency:
  group: update-contributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: alisher-ds
        run: node scripts/generate-contributions.mjs

      - name: Commit generated card
        run: |
          if [ -z "$(git status --porcelain -- assets/contributions.svg assets/engineering-pulse.svg)" ]; then
            echo "Contribution assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/engineering-pulse.svg
          git commit -m "chore: refresh contribution activity and engineering pulse"
          git push
