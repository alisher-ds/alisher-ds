  <text x="34" y="379" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10">LIVE PROFILE</text>
  <text x="34" y="400" fill="#F0F6FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">Click a metric or project to explore the underlying GitHub activity.</text>
  <a href="https://github.com/alisher-ds?tab=overview" target="_blank">
