      <text x="52" y="129" fill="#8B949E" font-size="10">CONTRIBUTIONS</text>
      <text x="52" y="157" fill="#F0F6FC" font-size="25" font-weight="700">347</text>
      <text x="101" y="156" fill="#58A6FF" font-size="10">↗ activity</text>
    </a>
    <a href="https://github.com/alisher-ds?tab=overview" target="_blank">
      <rect x="257" y="104" width="210" height="82" rx="12" fill="#161B22" stroke="#30363D"/>
      <text x="275" y="129" fill="#8B949E" font-size="10">ACTIVE DAYS</text>
      <text x="275" y="157" fill="#F0F6FC" font-size="25" font-weight="700">18</text>
      <text x="316" y="156" fill="#58A6FF" font-size="10">↗ rhythm</text>
    </a>
    <a href="https://github.com/alisher-ds?tab=overview" target="_blank">
      <rect x="480" y="104" width="210" height="82" rx="12" fill="#161B22" stroke="#30363D"/>
      <text x="498" y="129" fill="#8B949E" font-size="10">BEST STREAK</text>
      <text x="498" y="157" fill="#F0F6FC" font-size="25" font-weight="700">5</text>
      <text x="528" y="156" fill="#A371F7" font-size="10">days</text>
    </a>
    <a href="https://github.com/alisher-ds?tab=overview" target="_blank">
      <rect x="703" y="104" width="263" height="82" rx="12" fill="#161B22" stroke="#30363D"/>
      <text x="721" y="129" fill="#8B949E" font-size="10">PEAK DAY</text>
      <text x="721" y="157" fill="#F0F6FC" font-size="25" font-weight="700">108</text>
      <text x="776" y="156" fill="#A371F7" font-size="10">contributions</text>
    </a>
  </g>

  <text x="34" y="220" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="600">SELECTED SYSTEMS</text>

